name: docs

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Production documentation build: Zensical (Classic variant, pinned in
  # docs/requirements-zensical.txt). The site that is checked below is the very
  # directory (`site`) that the last step uploads as the Pages artifact, and the
  # upload happens only after every verification step has passed. The Material
  # for MkDocs build below is a verification reference only and is never
  # published. Rollback: see "Documentation site build" in
  # docs/implementation-notes.md.
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install docs dependencies (pinned Zensical, Material reference, browser test)
        run: >
          python -m pip install
          -r docs/requirements-zensical.txt
          -r docs/requirements-docs.txt
          -r docs/requirements-docs-browser.txt
      - name: Install Chromium for the search regression
        run: python -m playwright install --with-deps chromium
      - name: Build the Material reference site (verification only, never published)
        env:
          NO_MKDOCS_2_WARNING: "1"
        run: mkdocs build --strict -d "$RUNNER_TEMP/material-reference"
      # --strict: warnings (broken links, dead references) fail the build.
      - name: Build the documentation site with Zensical
        run: zensical build --clean --strict
      - name: Check the site structure against the Material reference
        run: python scripts/check_docs_site.py --site site --reference "$RUNNER_TEMP/material-reference" --self-test
      # Real-browser search over HTTP (never file://); --self-test proves the
      # check fails on deliberately broken copies, and a missing Playwright or
      # Chromium fails the job.
      - name: Check search in a real browser
        run: python scripts/check_docs_search.py --site site --self-test --diagnostics-dir "$RUNNER_TEMP/search-diagnostics"
      - name: Upload search diagnostics (failures only, not published)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: docs-search-diagnostics
          path: ${{ runner.temp }}/search-diagnostics
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  # Publication is gated on the repository variable DOCS_PUBLISH being
  # exactly "true": the workflow ships with the manual, but the site is
  # only activated (per the release decision) when the maintainer sets
  # that variable on pyrevo/annotater. Only a push to refs/heads/main can
  # deploy: pull requests and tag pushes build and verify but never publish.
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DOCS_PUBLISH == 'true'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
