name: release-ghcr

# Controlled publication of release-candidate (and later final-release)
# images to GitHub Container Registry.
#
# Publishing an image on every push is deliberately NOT configured: images
# are published only on an explicit `workflow_dispatch`, so every published
# image corresponds to a commit that a maintainer intentionally verified.
#
# The exact dispatched commit is published as two tags that resolve to the
# same image digest:
#   ghcr.io/pyrevo/annotater:<image_tag>      (e.g. 0.1.0-rc1)
#   ghcr.io/pyrevo/annotater:sha-<shortsha>   (per-commit traceability)
#
# `latest` is rejected: the SciLifeLab Serve deployment reference must always
# be an explicit, immutable tag (see docs/deployment.md).
#
# Published tags are immutable: before anything is built, the workflow
# checks GHCR and refuses to continue if either target tag already exists.
# The image tag has no default, so a dispatch can never silently re-target a
# historical release candidate.
#
# Platform: linux/amd64 only. The pinned Polars-Bio release publishes
# manylinux x86_64 wheels only; multi-arch publishing is out of scope until
# the dependency is revalidated (see docs/deployment.md).

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to publish (release candidate or final release), e.g. 0.1.0-rc2. Must not already exist in GHCR."
        required: true
        type: string

# Minimal permissions: read the source, write the container package.
permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  publish:
    name: Build (linux/amd64), smoke, push to GHCR
    runs-on: ubuntu-latest # x86_64: the amd64 image builds natively (no QEMU)
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Verify publication ref is main
        # The image must correspond to a commit that passed CI on main.
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Release images may only be published from 'main' (current ref: ${{ github.ref }})."
          exit 1

      - name: Reject non-immutable tags
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          if [ -z "${IMAGE_TAG//[[:space:]]/}" ]; then
            echo "::error::image_tag is required and must not be empty."
            exit 1
          fi
          case "$IMAGE_TAG" in
            latest|main|main-*)
              echo "::error::Tag '$IMAGE_TAG' is not allowed. Use an explicit, immutable tag (e.g. 0.1.0-rc2)."
              exit 1
              ;;
          esac
          echo "Publishing tag: $IMAGE_TAG"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Refuse to overwrite existing GHCR tags
        # Fails BEFORE build/push if either target tag already exists.
        # Only an explicit HTTP 404 from the registry means "absent"; any
        # other outcome (auth/network/unexpected status) fails safely and
        # is never treated as "tag absent".
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
          REPO: ${{ github.repository }}
          ACTOR: ${{ github.actor }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          short=$(git rev-parse --short HEAD)
          registry_token=$(curl --silent --show-error --fail \
            --user "${ACTOR}:${GH_TOKEN}" \
            "https://ghcr.io/token?service=ghcr.io&scope=repository:${REPO}:pull" \
            | python3 -c 'import sys, json; print(json.load(sys.stdin)["token"])')
          for tag in "$IMAGE_TAG" "sha-${short}"; do
            status=$(curl --silent --show-error --output /dev/null --head \
              --write-out '%{http_code}' \
              --header "Authorization: Bearer ${registry_token}" \
              --header "Accept: application/vnd.oci.image.index.v1+json, application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.v2+json" \
              "https://ghcr.io/v2/${REPO}/manifests/${tag}")
            case "$status" in
              200)
                echo "::error::Refusing to overwrite existing immutable GHCR tag: ${tag}"
                exit 1
                ;;
              404)
                echo "Tag ${tag} does not exist in GHCR; safe to publish."
                ;;
              *)
                echo "::error::Unable to verify whether GHCR tag ${tag} exists (HTTP ${status}); refusing to publish."
                exit 1
                ;;
            esac
          done

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ inputs.image_tag }}
            type=raw,value=sha-{{sha}}
          # Standard OCI labels. No release date or DOI is fabricated;
          # the revision label carries the exact commit SHA.
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ inputs.image_tag }}
            org.opencontainers.image.licenses=BSD-3-Clause
            org.opencontainers.image.title=AnnotateR
            org.opencontainers.image.description=Graphical interface to annotate genomic coordinates (Bedtools / Polars-Bio parity)

      - name: Build image (linux/amd64, local only)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: In-container smoke (bedtools, engines, canonical parity)
        # Pre-push gate: the candidate image must pass the same smoke CI
        # runs (scripts/docker_smoke.sh) before anything reaches the
        # registry. --entrypoint bash overrides the FastAPI server ENTRYPOINT.
        run: docker run --rm --entrypoint bash ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-$(git rev-parse --short HEAD) /app/scripts/docker_smoke.sh

      - name: Served-application smoke (startup, health, routes, sessions, export)
        # Pre-push gate for the served FastAPI/React application, so a broken
        # route or session model can never be published to GHCR.
        run: docker run --rm --entrypoint bash ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-$(git rev-parse --short HEAD) /app/scripts/docker_smoke_api.sh

      - name: Offline scientific-runtime smoke (no network)
        # Pre-push gate proving the scientific runtime is self-contained.
        run: docker run --rm --network none --entrypoint python ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-$(git rev-parse --short HEAD) /app/scripts/offline_smoke.py

      - name: Push both tags
        run: |
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ inputs.image_tag }}
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-$(git rev-parse --short HEAD)