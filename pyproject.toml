[project]
name = "annotater"
version = "0.1.0"
description = "AnnotateR: genomic coordinate annotation tool with interchangeable Bedtools and Polars-Bio backends"
readme = "README.md"
license = { text = "BSD-3-Clause" }
# Python 3.12 is the currently tested and supported runtime (CI and
# Docker). 3.13/3.14 satisfy this range (the exact pins install there,
# verified for 3.14) but are NOT part of the tested CI matrix. 3.10/3.11
# cannot install the exact pins at all (e.g. numpy==2.5.3 requires
# >=3.12). See docs/implementation-notes.md.
requires-python = ">=3.12,<3.15"
# All runtime dependencies are exact-pinned per the dependency/runtime
# policy established by Task 2.5 for the audited reproducible environment
# (SPEC.md imposes no pinning requirement): the pins match the audited
# supported environment (docs/implementation-notes.md).
dependencies = [
    "streamlit==1.64.0",
    "pandas==3.0.6",
    "numpy==2.5.3",
    "pybedtools==0.12.1",
    "polars==1.44.2",
    "polars-bio==0.35.1",
    "openpyxl==3.1.5",
    "plotly==7.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "black==26.5.1",
    "ruff==0.16.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["streamlit_app"]
# Build-only chromosome-registry inputs stay in the source tree for
# reproducibility (scripts/update_chrom_aliases.py, update_chrom_catalog.py)
# but are not runtime data: the wheel ships the generated registries and
# catalog.json only.
exclude = [
  "streamlit_app/core/chrom_registry/upstream/",
  "streamlit_app/core/chrom_registry/sources.json",
]